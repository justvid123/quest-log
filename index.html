<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a10;
    --bg-2:#0f0f18;
    --surface:rgba(255,255,255,0.045);
    --surface-solid:#161620;
    --surface-2:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.08);
    --border-soft:rgba(255,255,255,0.05);
    --grad-start:#8b5cf6;
    --grad-end:#ec4899;
    --violet:#a78bfa;
    --emerald:#34d399;
    --emerald-dim:rgba(52,211,153,0.14);
    --amber:#fbbf24;
    --rose:#fb7185;
    --text:#f5f4f8;
    --text-dim:#9c9ab0;
    --text-faint:#5f5d74;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(139,92,246,0.16), transparent 55%),
      radial-gradient(circle at 100% 25%, rgba(236,72,153,0.10), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:22px 14px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:480px;margin:0 auto;}

  /* hero card */
  .hero{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:24px;
    padding:22px 22px 20px;
    margin-bottom:22px;
    display:flex;
    align-items:center;
    gap:16px;
    backdrop-filter:blur(20px);
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute;
    top:-60%; right:-30%;
    width:220px; height:220px;
    background:radial-gradient(circle, rgba(139,92,246,0.22), transparent 70%);
    pointer-events:none;
  }
  .ring-wrap{
    position:relative;
    width:76px;
    height:76px;
    flex-shrink:0;
  }
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-track{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:6;}
  .ring-fill{
    fill:none;
    stroke:url(#ringGrad);
    stroke-width:6;
    stroke-linecap:round;
    transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);
  }
  .ring-level{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
  }
  .ring-level b{
    font-family:'Sora',sans-serif;
    font-size:22px;
    font-weight:700;
    line-height:1;
    background:linear-gradient(135deg,var(--grad-start),var(--grad-end));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .ring-level span{
    font-size:9px;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin-top:1px;
  }
  .hero-info{flex:1;min-width:0;position:relative;}
  .hero-rank{
    font-family:'Sora',sans-serif;
    font-size:18px;
    font-weight:700;
    color:var(--text);
    letter-spacing:-0.2px;
  }
  .hero-xp-caption{
    font-size:12px;
    color:var(--text-dim);
    margin:2px 0 10px;
  }
  .xp-track{
    width:100%;
    height:7px;
    background:rgba(255,255,255,0.06);
    border-radius:20px;
    overflow:hidden;
  }
  .xp-fill{
    height:100%;
    background:linear-gradient(90deg,var(--grad-start),var(--grad-end));
    border-radius:20px;
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .streak-pill{
    position:absolute;
    top:0; right:0;
    display:flex;
    align-items:center;
    gap:4px;
    background:rgba(251,113,133,0.14);
    color:var(--rose);
    border-radius:20px;
    padding:4px 10px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
  }

  /* section headers */
  .section-title{
    font-family:'Sora',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin:24px 4px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .section-count{
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--text-faint);
    font-weight:500;
    text-transform:none;
    letter-spacing:0;
  }

  /* quest cards */
  .quest{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 14px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:13px;
    transition:border-color .2s, background .2s, transform .15s;
  }
  .quest:active{transform:scale(0.99);}
  .quest.done{
    background:var(--emerald-dim);
    border-color:rgba(52,211,153,0.35);
  }
  .quest.removing{ opacity:0; transform:translateX(20px) scale(0.97); transition:opacity .25s, transform .25s; }

  .check{
    flex-shrink:0;
    width:26px;
    height:26px;
    border-radius:50%;
    border:2px solid var(--border);
    background:rgba(255,255,255,0.03);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:transparent;
    font-size:14px;
    font-weight:700;
    transition:all .18s cubic-bezier(.34,1.4,.64,1);
  }
  .quest.done .check{
    background:linear-gradient(135deg,var(--emerald),#10b981);
    border-color:transparent;
    color:#04241a;
    transform:scale(1.05);
  }
  .quest-body{flex:1;min-width:0;}
  .quest-name{
    font-size:14.5px;
    font-weight:500;
    color:var(--text);
    word-break:break-word;
  }
  .quest.done .quest-name{
    color:var(--text-faint);
    text-decoration:line-through;
    text-decoration-color:rgba(52,211,153,0.5);
  }
  .quest-meta{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:5px;
    font-size:11.5px;
  }
  .tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:2px 9px 2px 7px;
    border-radius:20px;
    font-weight:600;
    font-size:11px;
  }
  .tag-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .tag-mind{background:rgba(167,139,250,.13);color:var(--violet);}
  .tag-mind .tag-dot{background:var(--violet);}
  .tag-body{background:rgba(52,211,153,.13);color:var(--emerald);}
  .tag-body .tag-dot{background:var(--emerald);}
  .tag-work{background:rgba(251,191,36,.13);color:var(--amber);}
  .tag-work .tag-dot{background:var(--amber);}
  .tag-soul{background:rgba(236,72,153,.13);color:#f472b6;}
  .tag-soul .tag-dot{background:#f472b6;}
  .quest-fire{color:var(--text-faint);font-weight:600;}
  .quest-fire.lit{color:var(--rose);}
  .quest-xp{
    flex-shrink:0;
    font-family:'Sora',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--violet);
    white-space:nowrap;
  }
  .quest-del{
    flex-shrink:0;
    background:none;
    border:none;
    color:var(--text-faint);
    cursor:pointer;
    padding:4px;
    font-size:15px;
    line-height:1;
    opacity:0.5;
    transition:opacity .15s, color .15s;
  }
  .quest-del:hover{opacity:1;color:var(--rose);}

  .drag-handle{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:3px;
    width:20px;
    height:26px;
    cursor:grab;
    touch-action:none;
    padding:2px 4px;
  }
  .drag-handle span{
    display:block;
    height:2px;
    border-radius:2px;
    background:var(--text-faint);
  }
  .quest.dragging{
    position:relative;
    z-index:30;
    box-shadow:0 12px 30px rgba(0,0,0,0.45);
    border-color:var(--violet);
    cursor:grabbing;
  }
  .quest-desc{
    font-size:12px;
    color:var(--text-dim);
    margin-top:3px;
    word-break:break-word;
  }

  /* edit modal */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(5,5,10,0.6);
    backdrop-filter:blur(4px);
    z-index:100;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal-sheet{
    width:100%;
    max-width:480px;
    background:var(--surface-solid);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:22px 22px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .modal-title{
    font-family:'Sora',sans-serif;
    font-size:16px;
    font-weight:700;
    margin-bottom:14px;
  }
  textarea{
    width:100%;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    border-radius:11px;
    padding:11px 12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    resize:vertical;
    min-height:64px;
  }
  textarea:focus{outline:none;border-color:var(--violet);}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .btn-danger{background:transparent;border-color:rgba(251,113,133,0.35);color:var(--rose);}

  .empty{
    text-align:center;
    padding:34px 10px;
    color:var(--text-faint);
    font-size:13.5px;
    background:var(--surface);
    border:1px dashed var(--border);
    border-radius:16px;
  }

  /* add form */
  .add-toggle{
    width:100%;
    padding:14px;
    border-radius:16px;
    border:1px dashed var(--border);
    background:transparent;
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-top:8px;
    transition:border-color .2s, color .2s;
  }
  .add-toggle:hover{border-color:var(--violet);color:var(--violet);}

  .add-form{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    margin-top:8px;
    display:none;
    backdrop-filter:blur(20px);
  }
  .add-form.open{display:block;}
  .field-label{
    font-size:11.5px;
    color:var(--text-faint);
    font-weight:600;
    letter-spacing:0.3px;
    margin-bottom:6px;
    display:block;
    text-transform:uppercase;
  }
  .field{margin-bottom:14px;}
  input[type=text], select{
    width:100%;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    border-radius:11px;
    padding:11px 12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  input[type=text]:focus, select:focus{outline:none;border-color:var(--violet);}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .form-actions{display:flex;gap:10px;margin-top:4px;}
  .btn{
    flex:1;
    padding:12px;
    border-radius:11px;
    border:1px solid var(--border);
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .15s, transform .1s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:linear-gradient(135deg,var(--grad-start),var(--grad-end));border-color:transparent;color:#fff;}
  .btn-secondary{background:transparent;color:var(--text-dim);}
  .error-text{color:var(--rose);font-size:12px;margin-top:6px;display:none;}

  /* toast */
  .toast{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%) translateY(-20px);
    background:var(--surface-solid);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 20px;
    border-radius:14px;
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:14.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s, transform .3s;
    z-index:50;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
    <meta name="theme-color" content="#0a0a10">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon-192.png" type="image/png">

<body>
<div class="wrap">

  <div class="hero">
    <div class="ring-wrap">
      <svg viewBox="0 0 76 76" width="76" height="76">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="38" cy="38" r="33"/>
        <circle class="ring-fill" id="ringFill" cx="38" cy="38" r="33"/>
      </svg>
      <div class="ring-level">
        <b id="levelNum">1</b>
        <span>level</span>
      </div>
    </div>
    <div class="hero-info">
      <div class="streak-pill" id="dayStreakChip">0 day streak</div>
      <div class="hero-rank" id="rankLabel">Novice</div>
      <div class="hero-xp-caption" id="xpCaption">0 / 80 XP to next level</div>
      <div class="xp-track"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
    </div>
  </div>

  <div id="questSections"></div>

  <button class="add-toggle" id="addToggleBtn">+ add a quest</button>
  <div class="add-form" id="addForm">
    <div class="field">
      <label class="field-label">quest name</label>
      <input type="text" id="qName" placeholder="e.g. drink a glass of water">
    </div>
    <div class="field">
      <label class="field-label">description (optional)</label>
      <textarea id="qDesc" placeholder="Add a short description"></textarea>
    </div>
    <div class="row2">
      <div class="field">
        <label class="field-label">category</label>
        <select id="qCategory">
          <option value="mind">Mind</option>
          <option value="body">Body</option>
          <option value="work">Work</option>
          <option value="soul">Soul</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">difficulty</label>
        <select id="qDifficulty">
          <option value="easy">Easy · 10 XP</option>
          <option value="medium" selected>Medium · 20 XP</option>
          <option value="hard">Hard · 35 XP</option>
        </select>
      </div>
    </div>
    <div class="error-text" id="formError">Give your quest a name first.</div>
    <div class="form-actions">
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Add quest</button>
    </div>
  </div>

</div>

<div class="modal-overlay" id="editOverlay">
  <div class="modal-sheet">
    <div class="modal-title">Edit quest</div>
    <div class="field">
      <label class="field-label">quest name</label>
      <input type="text" id="editName" placeholder="Quest name">
    </div>
    <div class="field">
      <label class="field-label">category</label>
      <select id="editCategory">
        <option value="mind">Mind</option>
        <option value="body">Body</option>
        <option value="work">Work</option>
        <option value="soul">Soul</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">difficulty</label>
      <select id="editDifficulty">
        <option value="easy">Easy · 10 XP</option>
        <option value="medium">Medium · 20 XP</option>
        <option value="hard">Hard · 35 XP</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">description</label>
      <textarea id="editDesc" placeholder="Add a short description (optional)"></textarea>
    </div>
    <div class="error-text" id="editError">Give your quest a name first.</div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="editDeleteBtn">Delete</button>
      <button class="btn btn-secondary" id="editCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="editSaveBtn">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'quest-log-state-v1';
const CAT_LABEL = {mind:'Mind', body:'Body', work:'Work', soul:'Soul'};
const DIFF_XP = {easy:10, medium:20, hard:35};
const RANKS = [
  {min:1, name:'Novice'},
  {min:5, name:'Apprentice'},
  {min:10, name:'Adventurer'},
  {min:15, name:'Veteran'},
  {min:20, name:'Champion'},
  {min:30, name:'Legend'}
];

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function yesterdayStr(){
  const d = new Date();
  d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function xpNeededForLevel(level){
  return 220 + (level-1)*180;
}
function rankForLevel(level){
  let r = RANKS[0];
  for(const cand of RANKS){ if(level >= cand.min) r = cand; }
  return r.name;
}

let state = {
  level: 1,
  xp: 0,
  lastActiveDay: todayStr(),
  dayStreak: 0,
  quests: [
    {id:'q1', name:'Make your bed', description:'', category:'body', difficulty:'easy', done:false, streak:0, lastDone:null},
    {id:'q2', name:'Read for 15 minutes', description:'', category:'mind', difficulty:'medium', done:false, streak:0, lastDone:null},
    {id:'q3', name:"Plan tomorrow's top 3 tasks", description:'', category:'work', difficulty:'medium', done:false, streak:0, lastDone:null},
    {id:'q4', name:'5 minutes of quiet / gratitude', description:'', category:'soul', difficulty:'easy', done:false, streak:0, lastDone:null}
  ]
};

function uid(){ return 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const loaded = JSON.parse(raw);
      state = Object.assign(state, loaded);
    }
  } catch (e) {
    console.warn('Could not load saved Quest Log data.', e);
  }
  rolloverDayIfNeeded();
  render();
}

async function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('Could not save Quest Log data.', e);
  }
}

function rolloverDayIfNeeded(){
  const today = todayStr();
  if(state.lastActiveDay === today) return;

  const yesterday = yesterdayStr();
  const allDoneYesterday = state.quests.length > 0 && state.quests.every(q => q.done);

  if(state.lastActiveDay === yesterday && allDoneYesterday){
    state.dayStreak = (state.dayStreak || 0) + 1;
  } else if(state.lastActiveDay !== yesterday){
    state.dayStreak = 0;
  }
  // if lastActiveDay === yesterday but not all done, streak resets too
  if(state.lastActiveDay === yesterday && !allDoneYesterday){
    state.dayStreak = 0;
  }

  state.quests.forEach(q => { q.done = false; });
  state.lastActiveDay = today;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 1800);
}

function toggleQuest(id){
  const q = state.quests.find(x => x.id === id);
  if(!q) return;

  if(!q.done){
    q.done = true;
    const xpGain = DIFF_XP[q.difficulty];
    state.xp += xpGain;

    const today = todayStr();
    if(q.lastDone === yesterdayStr()){
      q.streak = (q.streak || 0) + 1;
    } else if(q.lastDone !== today){
      q.streak = 1;
    }
    q.lastDone = today;

    let leveledUp = false;
    while(state.xp >= xpNeededForLevel(state.level)){
      state.xp -= xpNeededForLevel(state.level);
      state.level += 1;
      leveledUp = true;
    }
    if(leveledUp){
      showToast('Level up! Now level ' + state.level + ' · ' + rankForLevel(state.level));
    } else {
      showToast('+' + xpGain + ' XP');
    }
  } else {
    q.done = false;
    const xpGain = DIFF_XP[q.difficulty];
    state.xp -= xpGain;
    while(state.xp < 0 && state.level > 1){
      state.level -= 1;
      state.xp += xpNeededForLevel(state.level);
    }
    if(state.xp < 0) state.xp = 0;
  }

  saveState();
  render();
}

function deleteQuest(id){
  formError.style.display = 'none';
  editError.style.display = 'none';
  const el = document.querySelector('[data-quest-id="'+id+'"]');
  if(el){
    el.classList.add('removing');
    setTimeout(()=>{
      state.quests = state.quests.filter(q => q.id !== id);
      saveState();
      render();
    }, 220);
  } else {
    state.quests = state.quests.filter(q => q.id !== id);
    saveState();
    render();
  }
}

const RING_RADIUS = 33;
const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

function render(){
  document.getElementById('rankLabel').textContent = rankForLevel(state.level);
  document.getElementById('levelNum').textContent = state.level;
  document.getElementById('dayStreakChip').textContent = (state.dayStreak||0) + ' day streak';

  const need = xpNeededForLevel(state.level);
  const pct = Math.min(100, Math.round((state.xp/need)*100));
  document.getElementById('xpFill').style.width = pct + '%';
  document.getElementById('xpCaption').textContent = state.xp + ' / ' + need + ' XP to next level';

  const ring = document.getElementById('ringFill');
  ring.style.strokeDasharray = RING_CIRCUMFERENCE;
  ring.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - pct/100);

  const container = document.getElementById('questSections');
  container.innerHTML = '';

  if(state.quests.length === 0){
    container.innerHTML = '<div class="empty">No quests yet. Add your first one below to start earning XP.</div>';
    return;
  }

  state.quests.forEach(q => {
    const card = document.createElement('div');
    card.className = 'quest' + (q.done ? ' done' : '');
    card.setAttribute('data-quest-id', q.id);
    const fireLit = (q.streak||0) > 0 ? ' lit' : '';
    const descHtml = q.description ? `<div class="quest-desc">${escapeHtml(q.description)}</div>` : '';
    card.innerHTML = `
      <div class="drag-handle" data-action="drag" aria-label="Reorder quest"><span></span><span></span><span></span></div>
      <div class="check" data-action="toggle">${q.done ? '✓' : ''}</div>
      <div class="quest-body" data-action="body">
        <div class="quest-name">${escapeHtml(q.name)}</div>
        ${descHtml}
        <div class="quest-meta">
          <span class="tag tag-${q.category}"><span class="tag-dot"></span>${CAT_LABEL[q.category]}</span>
          <span class="quest-fire${fireLit}">${(q.streak||0) > 0 ? '🔥 ' + q.streak : ''}</span>
        </div>
      </div>
      <div class="quest-xp">+${DIFF_XP[q.difficulty]}</div>
      <button class="quest-del" data-action="delete" aria-label="Delete quest">✕</button>
    `;
    card.querySelector('[data-action="toggle"]').addEventListener('click', () => toggleQuest(q.id));
    card.querySelector('[data-action="delete"]').addEventListener('click', (e) => { e.stopPropagation(); deleteQuest(q.id); });
    attachDragHandlers(card.querySelector('[data-action="drag"]'), card, q);
    attachLongPress(card.querySelector('[data-action="body"]'), q.id);
    container.appendChild(card);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// add form wiring
const addToggleBtn = document.getElementById('addToggleBtn');
const addForm = document.getElementById('addForm');
const qName = document.getElementById('qName');
const qDesc = document.getElementById('qDesc');
const qCategory = document.getElementById('qCategory');
const qDifficulty = document.getElementById('qDifficulty');
const formError = document.getElementById('formError');

addToggleBtn.addEventListener('click', () => {
  addForm.classList.add('open');
  addToggleBtn.style.display = 'none';
  qName.focus();
});
document.getElementById('cancelBtn').addEventListener('click', closeForm);
function closeForm(){
  addForm.classList.remove('open');
  addToggleBtn.style.display = 'block';
  qName.value = '';
  qDesc.value = '';
  formError.style.display = 'none';
}
document.getElementById('saveBtn').addEventListener('click', () => {
  const name = qName.value.trim();
  if(!name){
    formError.style.display = 'block';
    qName.focus();
    return;
  }
  formError.style.display = 'none';
  state.quests.push({
    id: uid(),
    name: name,
    description: qDesc.value.trim(),
    category: qCategory.value,
    difficulty: qDifficulty.value,
    done: false,
    streak: 0,
    lastDone: null
  });
  saveState();
  render();
  closeForm();
});
qName.addEventListener('input', () => { if(qName.value.trim()) formError.style.display = 'none'; });

// drag-to-reorder
let dragCtx = null;

function attachDragHandlers(handleEl, cardEl, quest){
  handleEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const container = document.getElementById('questSections');
    const siblings = Array.from(container.querySelectorAll('.quest'));
    const rects = siblings.map(el => ({ id: el.getAttribute('data-quest-id'), rect: el.getBoundingClientRect() }));
    dragCtx = {
      questId: quest.id,
      startY: e.clientY,
      cardEl,
      currentDelta: 0,
      siblingsRects: rects
    };
    cardEl.classList.add('dragging');
    try{ handleEl.setPointerCapture(e.pointerId); }catch(err){}
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd, { once: true });
  });
}

function onDragMove(e){
  if(!dragCtx) return;
  const delta = e.clientY - dragCtx.startY;
  dragCtx.currentDelta = delta;
  dragCtx.cardEl.style.transform = `translateY(${delta}px)`;
}

function onDragEnd(){
  if(!dragCtx) return;
  document.removeEventListener('pointermove', onDragMove);

  const delta = dragCtx.currentDelta || 0;
  const draggedEntry = dragCtx.siblingsRects.find(s => s.id === dragCtx.questId);

  if(draggedEntry){
    const draggedCenterY = draggedEntry.rect.top + draggedEntry.rect.height/2 + delta;
    const others = dragCtx.siblingsRects.filter(s => s.id !== dragCtx.questId);

    let newIndex = others.length;
    for(let i=0;i<others.length;i++){
      const center = others[i].rect.top + others[i].rect.height/2;
      if(draggedCenterY < center){ newIndex = i; break; }
    }

    const draggedIdx = state.quests.findIndex(q => q.id === dragCtx.questId);
    if(draggedIdx !== -1){
      const [moved] = state.quests.splice(draggedIdx, 1);
      state.quests.splice(newIndex, 0, moved);
      saveState();
    }
  }

  if(dragCtx.cardEl){
    dragCtx.cardEl.classList.remove('dragging');
    dragCtx.cardEl.style.transform = '';
  }
  dragCtx = null;
  render();
}

// long-press to edit
function attachLongPress(bodyEl, questId){
  let pressTimer = null;
  let startX = 0, startY = 0;
  let moved = false;

  const start = (e) => {
    startX = e.clientX; startY = e.clientY;
    moved = false;
    pressTimer = setTimeout(() => { openEditModal(questId); }, 500);
  };
  const move = (e) => {
    if(Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8){
      moved = true;
      clearTimeout(pressTimer);
    }
  };
  const end = () => { clearTimeout(pressTimer); };

  bodyEl.addEventListener('pointerdown', start);
  bodyEl.addEventListener('pointermove', move);
  bodyEl.addEventListener('pointerup', end);
  bodyEl.addEventListener('pointerleave', end);
}

// edit modal
const editOverlay = document.getElementById('editOverlay');
const editName = document.getElementById('editName');
const editDesc = document.getElementById('editDesc');
const editCategory = document.getElementById('editCategory');
const editDifficulty = document.getElementById('editDifficulty');
const editError = document.getElementById('editError');
let editingId = null;

function openEditModal(questId){
  const q = state.quests.find(x => x.id === questId);
  if(!q) return;
  editingId = questId;
  editName.value = q.name;
  editDesc.value = q.description || '';
  editCategory.value = q.category;
  editDifficulty.value = q.difficulty;
  editError.style.display = 'none';
  editOverlay.classList.add('open');
  if(navigator.vibrate) navigator.vibrate(15);
}
function closeEditModal(){
  editOverlay.classList.remove('open');
  editError.style.display = 'none';
  editingId = null;
}
editOverlay.addEventListener('click', (e) => { if(e.target === editOverlay) closeEditModal(); });
document.getElementById('editCancelBtn').addEventListener('click', closeEditModal);
document.getElementById('editSaveBtn').addEventListener('click', () => {
  const name = editName.value.trim();
  if(!name){
    editError.style.display = 'block';
    editName.focus();
    return;
  }
  const q = state.quests.find(x => x.id === editingId);
  if(q){
    q.name = name;
    q.description = editDesc.value.trim();
    q.category = editCategory.value;
    q.difficulty = editDifficulty.value;
    saveState();
    render();
  }
  closeEditModal();
});
document.getElementById('editDeleteBtn').addEventListener('click', () => {
  if(editingId){
    state.quests = state.quests.filter(q => q.id !== editingId);
    saveState();
    render();
  }
  closeEditModal();
});
editName.addEventListener('input', () => { if(editName.value.trim()) editError.style.display = 'none'; });

if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err =>
          console.warn('Service worker registration failed:', err)
        );
      });
    }

    loadState();
</script>
